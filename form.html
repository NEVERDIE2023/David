<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de paiement</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Formulaire de paiement</h2>

    <form action="#" method="POST">

        <!-- Nom -->
        <label for="nom">Nom</label>
        <input 
            type="text" 
            id="nom" 
            name="nom" 
            placeholder="Entrez le nom" 
            required
        >

        <!-- Prénom -->
        <label for="prenom">Prénom</label>
        <input 
            type="text" 
            id="prenom" 
            name="prenom" 
            placeholder="Entrez le prénom" 
            required
        >

        <!-- Montant -->
        <label for="montant">Montant</label>
        <input 
            type="number" 
            id="montant" 
            name="montant" 
            placeholder="Exemple : 50000" 
            min="1"
            required
        >

        <!-- Motif -->
        <label for="motif">Motif du paiement</label>
        <select id="motif" name="motif" required>
            <option value="">-- Sélectionnez le motif --</option>
            <option value="inscription">Frais d'inscription</option>
            <option value="scolarite">Frais de scolarité</option>
            <option value="examen">Frais d'examen</option>
            <option value="bibliotheque">Frais de bibliothèque</option>
            <option value="autre">Autre</option>
        </select>

        <!-- Mode de paiement -->
        <label for="mode">Mode de paiement</label>
        <select id="mode" name="mode" required>
            <option value="">-- Sélectionnez le mode --</option>
            <option value="lumicash">Lumicash</option>
            <option value="ecocash">EcoCash</option>
            <option value="banque">Virement bancaire</option>
            <option value="especes">Espèces</option>
        </select>

        <!-- Téléphone -->
        <label for="telephone">Numéro de téléphone</label>
        <input 
            type="tel" 
            id="telephone" 
            name="telephone" 
            placeholder="Exemple : 79 123 456" 
            required
        >

        <!-- Date -->
        <label for="date">Date du paiement</label>
        <input 
            type="date" 
            id="date" 
            name="date" 
            required
        >

        <!-- Bouton -->
        <button type="submit">Effectuer le paiement</button>

    </form>

</div>

</body>
</html>
